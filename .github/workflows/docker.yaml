name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '00 19 * * *'   # UTC 时间 = 北京时间每天凌晨 3:00

# 手动触发和定时任务撞车时排队，不并发推镜像
concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # skopeo：兜底处理 zstd/OCI 新格式镜像（docker push 会被 ACR 拒收的那种）
    - name: Install skopeo
      run: sudo apt-get update && sudo apt-get install -y skopeo
        
    - name: Build and push image Aliyun
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        # 预处理 images.txt：去掉 Windows 换行符 \r，避免解析出诡异问题
        tr -d '\r' < images.txt > /tmp/images_clean.txt

        # 数据预处理：判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]}" ]]; then
                 if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < /tmp/images_clean.txt

        # 逐行拉取 → 打标签 → 推送（失败自动 skopeo 转码）
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue

            echo "docker pull $line"
            docker pull $line

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "docker tag $image $new_image"
            docker tag "$image" "$new_image"

            echo "docker push $new_image"
            if ! docker push "$new_image"; then
                echo "docker push 失败，镜像可能是 zstd/OCI 格式，改用 skopeo 转码直推"
                extra_args=()
                if [ -n "$platform" ]; then
                    extra_args+=(--override-os "${platform%%/*}" --override-arch "${platform##*/}")
                fi
                skopeo copy --dest-compress-format gzip --format v2s2 \
                    "${extra_args[@]}" \
                    --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
                    "docker://$image" "docker://$new_image"
            fi

            # 清理本地镜像；清理失败不影响结果
            docker rmi "$image" "$new_image" || true
        done < /tmp/images_clean.txt
